<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FDE047" />
      <stop offset="50%" stopColor="#EAB308" />
      <stop offset="100%" stopColor="#CA8A04" />
    </linearGradient>
  </defs>
  
  <!-- Fond jaune doré arrondi -->
  <rect width="512" height="512" rx="120" fill="url(#bg-grad)" />

  <!-- Couronne Royale Pure Noire au centre -->
  <g transform="translate(56, 80)">
    <path 
      d="M 40,260 
         L 65,100 
         L 165,190 
         L 200,60 
         L 235,190 
         L 335,100 
         L 360,260 
         Z" 
      fill="#020617" 
      stroke="#020617" 
      stroke-width="16" 
      stroke-linejoin="round"
      stroke-linecap="round"
    />
    <!-- 3 Perles au sommet -->
    <circle cx="65" cy="95" r="22" fill="#020617" />
    <circle cx="200" cy="55" r="26" fill="#020617" />
    <circle cx="335" cy="95" r="22" fill="#020617" />
  </g>
</svg>
